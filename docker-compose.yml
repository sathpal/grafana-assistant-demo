# =============================================================================
# grafana-assistant-demo · the polyglot publishing tier the assistant debugs
#   Python approvals-api -> Kafka -> Java publisher-service -> Go media-service (cache-redis) -> Postgres
#   Python content-batch (reindex) · site-reader (traffic) · kafka-exporter · redis_exporter
#   Grafana Alloy ships OTLP + exporter scrapes + container logs to Grafana Cloud.
# Container names stay cortex-* so service_name labels match the articles and dashboards.
# =============================================================================
name: cortex

x-otel-env: &otel-env
  OTEL_EXPORTER_OTLP_ENDPOINT: http://alloy:4317
  OTEL_EXPORTER_OTLP_PROTOCOL: grpc

volumes:
  kafka-data:
  cache-redis-data:
  postgres-data:
  alloy-data:

networks:
  cortex:
    name: cortex
    driver: bridge

services:

  # ---- shared infrastructure (Postgres for the publisher, Alloy shipping everything to Grafana Cloud)
  postgres:
    image: postgres:16
    container_name: cortex-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cortex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cortex_dev_only}
      POSTGRES_DB: ${POSTGRES_DB:-cortex}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cortex} -d ${POSTGRES_DB:-cortex}"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [cortex]

  alloy:
    image: grafana/alloy:v1.19.2
    container_name: cortex-alloy
    restart: unless-stopped
    command: ["run", "/etc/alloy/config.alloy", "--server.http.listen-addr=0.0.0.0:12345", "--storage.path=/var/lib/alloy/data"]
    environment:
      GRAFANA_CLOUD_OTLP_ENDPOINT: ${GRAFANA_CLOUD_OTLP_ENDPOINT:-}
      GRAFANA_CLOUD_INSTANCE_ID: ${GRAFANA_CLOUD_INSTANCE_ID:-}
      GRAFANA_CLOUD_API_TOKEN: ${GRAFANA_CLOUD_API_TOKEN:-}
    volumes:
      - ./infra/alloy/${ALLOY_CONFIG:-config.alloy}:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy/data
    ports:
      - "4317:4317"
      - "4318:4318"
      - "12345:12345"
    networks: [cortex]

  # ---- the human gate: approve an article -> Kafka cortex.content.approved
  approvals-api:
    build:
      context: ./services/approvals-api
    image: cortex/approvals-api:dev
    container_name: cortex-api
    restart: unless-stopped
    environment:
      <<: *otel-env
      OTEL_SERVICE_NAME: cortex-api
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=cortex,deployment.environment=local,service.version=0.1.0
      KAFKA_BOOTSTRAP: kafka:9092
    ports:
      - "8000:8000"
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/healthz"]
      interval: 10s
      timeout: 3s
      retries: 20
    networks: [cortex]

  # ---- optional: self-hosted Grafana OSS target (profile "oss") -----------------------------------
  # grafana/otel-lgtm = Grafana + Prometheus + Loki + Tempo + an OTel collector, all open source, in one
  # container. Alloy fans the same telemetry out to it (config.dual.alloy), and a second mcp-grafana
  # points the assistant at it: make oss-up && make mcp-oss
  lgtm:
    image: grafana/otel-lgtm:latest
    container_name: cortex-lgtm
    profiles: ["oss"]
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_OSS_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_OSS_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      ENABLE_LOGS_ALL: "false"
    ports:
      - "3001:3000"     # Grafana OSS
      - "4417:4317"     # OTLP gRPC (from Alloy, in-network it is lgtm:4317)
      - "4418:4318"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000/api/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks: [cortex]

  kafka:
    image: apache/kafka:3.9.0
    container_name: cortex-kafka
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 6
      KAFKA_HEAP_OPTS: "-Xmx256m -Xms128m"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 20s
    networks: [cortex]

  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.8.0
    container_name: cortex-kafka-exporter
    restart: unless-stopped
    command: ["--kafka.server=kafka:9092", "--topic.filter=cortex.*", "--group.filter=.*"]
    depends_on:
      kafka:
        condition: service_healthy
    networks: [cortex]

  cache-redis:
    image: redis:7
    container_name: cortex-cache-redis
    restart: unless-stopped
    # A deliberately small cache tier: 48 MiB with LRU eviction, so a "no TTL" bug shows up as evictions.
    command: ["redis-server", "--maxmemory", "48mb", "--maxmemory-policy", "allkeys-lru", "--save", "", "--loglevel", "warning"]
    volumes:
      - cache-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [cortex]

  redis-exporter:
    image: oliver006/redis_exporter:v1.66.0
    container_name: cortex-redis-exporter
    restart: unless-stopped
    environment:
      REDIS_ADDR: redis://cache-redis:6379
    depends_on:
      cache-redis:
        condition: service_healthy
    networks: [cortex]

  publisher-service:
    build:
      context: ./services/publisher-service
    image: cortex/publisher-service:dev
    container_name: cortex-publisher-service
    restart: unless-stopped
    env_file:
      - .env
    environment:
      <<: *otel-env
      OTEL_SERVICE_NAME: cortex-publisher-service
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=cortex,deployment.environment=local,service.version=0.1.0
      OTEL_METRICS_EXPORTER: otlp
      OTEL_LOGS_EXPORTER: none
      OTEL_METRIC_EXPORT_INTERVAL: "15000"
      OTEL_INSTRUMENTATION_MICROMETER_ENABLED: "true"
      OTEL_INSTRUMENTATION_KAFKA_EXPERIMENTAL_SPAN_ATTRIBUTES: "true"
      OTEL_INSTRUMENTATION_RUNTIME_TELEMETRY_EMIT_EXPERIMENTAL_TELEMETRY: "true"
      KAFKA_BOOTSTRAP: kafka:9092
      CACHE_REDIS_HOST: cache-redis
      MEDIA_BASE_URL: http://media-service:8086
      POSTGRES_JDBC_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-cortex}
      KAFKA_CONSUMER_CONCURRENCY: ${KAFKA_CONSUMER_CONCURRENCY:-1}
      RENDER_MS: ${PUBLISHER_RENDER_MS:-30}
    ports:
      - "8085:8085"
    depends_on:
      kafka:
        condition: service_healthy
      cache-redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      media-service:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8085/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s
    networks: [cortex]

  media-service:
    build:
      context: ./services/media-service
    image: cortex/media-service:dev
    container_name: cortex-media-service
    restart: unless-stopped
    environment:
      <<: *otel-env
      OTEL_SERVICE_NAME: cortex-media-service
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=cortex,deployment.environment=local,service.version=0.1.0
      CACHE_REDIS_ADDR: cache-redis:6379
      OTEL_SEMCONV_STABILITY_OPT_IN: http/dup
      KAFKA_BOOTSTRAP: kafka:9092
      RENDER_MS: ${MEDIA_RENDER_MS:-40}
      CACHE_TTL_SECONDS: ${MEDIA_CACHE_TTL_SECONDS:-3600}
    ports:
      - "8086:8086"
    depends_on:
      kafka:
        condition: service_healthy
      cache-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8086/healthz"]
      interval: 10s
      timeout: 3s
      retries: 20
    networks: [cortex]

  content-batch:
    build:
      context: ./services/content-batch
    image: cortex/content-batch:dev
    container_name: cortex-content-batch
    restart: unless-stopped
    env_file:
      - .env
    environment:
      <<: *otel-env
      OTEL_SERVICE_NAME: cortex-content-batch
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=cortex,deployment.environment=local,service.version=0.1.0
      KAFKA_BOOTSTRAP: kafka:9092
      PUBLISHER_URL: http://publisher-service:8085
      MEDIA_URL: http://media-service:8086
      BATCH_SIZE: ${BATCH_SIZE:-25}
      BATCH_CONCURRENCY: ${BATCH_CONCURRENCY:-4}
      BATCH_INTERVAL_S: ${BATCH_INTERVAL_S:-300}
    ports:
      - "8087:8087"
    depends_on:
      kafka:
        condition: service_healthy
      publisher-service:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8087/healthz"]
      interval: 10s
      timeout: 3s
      retries: 20
    networks: [cortex]

  site-reader:
    image: cortex/content-batch:dev
    container_name: cortex-site-reader
    restart: unless-stopped
    command: ["python", "reader.py"]
    environment:
      <<: *otel-env
      OTEL_SERVICE_NAME: cortex-site-reader
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=cortex,deployment.environment=local,service.version=0.1.0
      PUBLISHER_URL: http://publisher-service:8085
      READER_RPS: ${READER_RPS:-5}
    depends_on:
      content-batch:
        condition: service_started
    networks: [cortex]
